  <script src="js/page5-fx.js"></script>
  <script>
  (function () {
    var entryAnim = sessionStorage.getItem(Page5State.ENTRY_KEY);
    var state = Page5State.loadState();
    var centerImg = document.getElementById('center-sword-img');
    var centerWrap = document.getElementById('center-icon-wrap');
    var pageRoot = document.getElementById('page-root');

    Page5State.initPageEnter();
    Page5Fx.initGoldenSparks(document.getElementById('spark-canvas'));
    Page5Fx.initTitleFx(document.getElementById('title-block'));

    var centerFx = Page5Fx.initCenterFx(centerWrap, {
      fxSize: 360,
      premium: true,
      scheme: 'apotheosis',
      burstOnLoad: entryAnim === 'forward',
      popOnLoad: true
    });

    if (state.swordSrc && centerImg) {
      centerImg.src = state.swordSrc;
      centerFx.pop();
    }

    var nameInput = Page5Fx.initNameInput(document.getElementById('name-input-wrap'), {
      initialName: state.swordName || '独孤九剑',
      onChange: function (name) {
        state = Page5State.loadState();
        state.swordName = name;
        Page5State.setState(state);
      }
    });
    Page5Fx.initDice(document.getElementById('dice-btn'), nameInput);
    Page5Fx.initStartFlash(document.getElementById('start-btn'), pageRoot);

    document.getElementById('back-btn').addEventListener('click', function () {
      state = Page5State.loadState();
      state.swordName = nameInput.getName();
      Page5State.setState(state);
      Page5State.navigateWithSlide('page5-1.html', 'back');
    });

  })();
  </script>
