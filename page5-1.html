  <script src="js/page5-state.js"></script>
  <script src="js/page5-fx.js"></script>
  <script>
  (function () {
    var PAGE_COUNT = 7;
    var ICONS_PER_PAGE = 9;
    var GRID_PAGE_HEIGHT = 356;
    var SWORD_COUNT = 63;
    var GRID_SEED = 202606631;
    var NAV_DELAY = 75;

    var gridTrack = document.getElementById('grid-track');
    var gridDots = document.getElementById('grid-page-dots');
    var nextBtn = document.getElementById('next-page-btn');
    var shockFx = Page5Fx.createGridShockwave(document.getElementById('grid-shock-canvas'));
    var orbitTrail = Page5Fx.createGridOrbitTrail(document.getElementById('grid-trail-canvas'), {
      getSelectedButton: function () {
        if (selectedPage < 0 || selectedIndex < 0 || selectedPage !== currentPage) return null;
        var page = gridTrack.querySelector('.grid-page[data-page="' + currentPage + '"]');
        if (!page) return null;
        return page.children[selectedIndex] || null;
      }
    });
    var state = Page5State.loadState();
    var currentPage = 0;
    var selectedPage = state.selectedPage;
    var selectedIndex = state.selectedIndex;
    var iconPages = [];
    var navigating = false;

    Page5State.initPageEnter();
    Page5Fx.initGoldenSparks(document.getElementById('spark-canvas'));
    Page5Fx.initTitleFx(document.getElementById('title-block'));

    function swordSrc(index) {
      return 'assets/images/swords/sword-' + (index + 1) + '.png';
    }

    function sword2Src(index) {
      return 'assets/images/swords2/sword-' + (index + 1) + '.png';
    }

    function nextSeed(seed) {
      return (seed * 1103515245 + 12345) & 0x7fffffff;
    }

    /** Fisher-Yates shuffle of arbitrary index array with fixed seed */
    function shuffleIndices(arr, seed) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        seed = nextSeed(seed);
        var j = Math.floor((seed / 0x7fffffff) * (i + 1));
        var tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    }

    function buildIconPages() {
      iconPages = [];
      var page0 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        page0.push({ swordIndex: j, src: sword2Src(j) });
      }
      iconPages.push(page0);

      var page1 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        page1.push({ swordIndex: 9 + j, src: sword2Src(9 + j) });
      }
      iconPages.push(page1);

      var page2 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        page2.push({ swordIndex: 18 + j, src: sword2Src(18 + j) });
      }
      iconPages.push(page2);

      /* 第 4 页固定主套 28~36（0-based index 27~35） */
      var page3 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        var fixedIdx = 27 + j;
        page3.push({ swordIndex: fixedIdx, src: swordSrc(fixedIdx) });
      }
      iconPages.push(page3);

      /* 第 5 页固定主套 37~45（0-based index 36~44） */
      var page4 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        var fixedIdx2 = 36 + j;
        page4.push({ swordIndex: fixedIdx2, src: swordSrc(fixedIdx2) });
      }
      iconPages.push(page4);

      /* 第 6 页固定主套 46~54（0-based index 45~53） */
      var page5 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        var fixedIdx3 = 45 + j;
        page5.push({ swordIndex: fixedIdx3, src: swordSrc(fixedIdx3) });
      }
      iconPages.push(page5);

      /* 第 7 页固定主套 55~63（0-based index 54~62） */
      var page6 = [];
      for (var j = 0; j < ICONS_PER_PAGE; j++) {
        var fixedIdx4 = 54 + j;
        page6.push({ swordIndex: fixedIdx4, src: swordSrc(fixedIdx4) });
      }
      iconPages.push(page6);
    }

    function isSelected(pageIdx, idx) {
      return selectedPage === pageIdx && selectedIndex === idx;
    }

    function updateDots() {
      Page5Fx.updateGridDots(gridDots, PAGE_COUNT, currentPage);
    }

    function updateSelectionUI() {
      var buttons = gridTrack.querySelectorAll('.grid-icon-btn');
      for (var i = 0; i < buttons.length; i++) {
        var btn = buttons[i];
        btn.classList.toggle('is-selected', isSelected(
          Number(btn.getAttribute('data-page')),
          Number(btn.getAttribute('data-index'))
        ));
      }
    }

    function syncCurrentPageClass() {
      var pages = gridTrack.querySelectorAll('.grid-page');
      for (var i = 0; i < pages.length; i++) {
        pages[i].classList.toggle('is-current', i === currentPage);
      }
    }

    function updateTrackPosition(animate) {
      if (animate === false) gridTrack.classList.add('no-transition');
      else gridTrack.classList.remove('no-transition');
      gridTrack.style.transform = 'translateY(' + (-currentPage * GRID_PAGE_HEIGHT) + 'px)';
      if (animate === false) {
        requestAnimationFrame(function () { gridTrack.classList.remove('no-transition'); });
      }
      syncCurrentPageClass();
      updateDots();
      updateSelectionUI();
    }

    function persistState() {
      var s = Page5State.loadState();
      s.gridPage = currentPage;
      s.selectedPage = selectedPage;
      s.selectedIndex = selectedIndex;
      s.swordSrc = selectedPage >= 0
        ? iconPages[selectedPage][selectedIndex].src
        : (state.swordSrc || sword2Src(0));
      Page5State.setState(s);
    }

    function goToGridPage(page) {
      currentPage = (page % PAGE_COUNT + PAGE_COUNT) % PAGE_COUNT;
      orbitTrail.clear();
      updateTrackPosition(true);
      persistState();
    }

    function selectIcon(pageIdx, idx, btn) {
      if (navigating) return;
      navigating = true;
      selectedPage = pageIdx;
      selectedIndex = idx;
      updateSelectionUI();
      persistState();
      Page5Fx.triggerIconBounce(btn);
      shockFx.trigger(btn);
      window.setTimeout(function () {
        Page5State.navigateWithSlide('page5-2.html', 'forward');
      }, NAV_DELAY);
    }

    function createIconButton(pageIdx, idx, icon) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'grid-icon-btn relative aspect-square rounded-full' +
        (isSelected(pageIdx, idx) ? ' is-selected' : '');
      btn.setAttribute('data-page', String(pageIdx));
      btn.setAttribute('data-index', String(idx));
      btn.setAttribute('aria-label', '选择第' + (pageIdx + 1) + '页第' + (idx + 1) + '把剑');
      btn.innerHTML =
        '<div class="grid-icon-bounce-wrap size-full">' +
          '<div class="icon-border-silver relative size-full rounded-full">' +
            '<div class="relative size-full overflow-hidden rounded-full">' +
              '<img alt="" class="absolute inset-0 size-full max-w-none rounded-full object-cover" src="' + icon.src + '">' +
            '</div>' +
          '</div>' +
        '</div>';
      btn.addEventListener('click', function () { selectIcon(pageIdx, idx, btn); });
      return btn;
    }

    function renderGrid() {
      gridTrack.innerHTML = '';
      for (var p = 0; p < PAGE_COUNT; p++) {
        var pageEl = document.createElement('div');
        pageEl.className = 'grid-page grid grid-cols-3 grid-rows-3 gap-x-[10px] gap-y-[22px]';
        pageEl.setAttribute('data-page', String(p));
        for (var i = 0; i < iconPages[p].length; i++) {
          pageEl.appendChild(createIconButton(p, i, iconPages[p][i]));
        }
        gridTrack.appendChild(pageEl);
      }
      updateTrackPosition(false);
    }

    nextBtn.addEventListener('click', function () { goToGridPage(currentPage + 1); });

    buildIconPages();
    currentPage = Math.min(Math.max(state.gridPage || 0, 0), PAGE_COUNT - 1);
    selectedPage = typeof state.selectedPage === 'number' ? state.selectedPage : -1;
    selectedIndex = typeof state.selectedIndex === 'number' ? state.selectedIndex : -1;
    renderGrid();
  })();
  </script>
